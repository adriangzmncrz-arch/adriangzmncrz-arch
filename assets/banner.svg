<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Adrián Guzmán — GRC &amp; Cybersecurity Consultant · Lead Auditor · ISO 27001 · ISO 9001 · ISO 22301">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB224" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB224" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFB224" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name  { font: 700 68px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -1px;
               animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
      .role  { font: 500 23px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #d4d4d8;
               animation: rise 1.1s .3s cubic-bezier(.2,.7,.2,1) both; }
      .norms { font: 500 16px "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #FFB224; letter-spacing: 3px;
               animation: rise 1.1s .5s cubic-bezier(.2,.7,.2,1) both; }
      .accent{ fill: #FFB224; }
      .bar   { transform-origin: 600px 0; animation: grow 1.4s .5s cubic-bezier(.2,.7,.2,1) both; }
      .scan  { animation: sweep 7s linear infinite; }
      @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes sweep { from { transform: translateX(-400px); } to { transform: translateX(1300px); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#000000"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect class="scan" x="0" y="0" width="300" height="300" fill="url(#scan)"/>

    <text class="name" x="600" y="132" text-anchor="middle">Adrián Guzmán</text>
    <rect class="bar accent" x="530" y="156" width="140" height="4" rx="2"/>
    <text class="role" x="600" y="204" text-anchor="middle">GRC &amp; Cybersecurity Consultant · Lead Auditor</text>
    <text class="norms" x="600" y="244" text-anchor="middle">ISO 27001 · ISO 9001 · ISO 22301</text>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
</svg>
