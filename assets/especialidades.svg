<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="Especialidades: Gestión del SGSI, Gestión de riesgos, Respuesta a incidentes, Continuidad del negocio">
  <defs>
    <style>
      .card  { fill: #000000; stroke: #ffffff; stroke-opacity: 0.10; }
      .num   { font: 500 15px "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #FFB224; letter-spacing: 2px; }
      .title { font: 600 27px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -0.3px; }
      .desc  { font: 400 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a1a1aa; }
      .icon  { fill: none; stroke: #FFB224; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .line  { fill: #FFB224; }
      .in    { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
      .d1 { animation-delay: .10s; } .d2 { animation-delay: .25s; }
      .d3 { animation-delay: .40s; } .d4 { animation-delay: .55s; }
      .grow  { transform-origin: 40px 0; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
      .d1 .grow { animation-delay: .5s; } .d2 .grow { animation-delay: .65s; }
      .d3 .grow { animation-delay: .8s; } .d4 .grow { animation-delay: .95s; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <!-- 01 · SGSI -->
  <g transform="translate(0,0)">
    <g class="in d1">
      <rect class="card" x="0.5" y="0.5" width="589" height="239" rx="16"/>
      <g transform="translate(40,36) scale(1.15)">
        <path class="icon" d="M20 4 L34 9 V19 C34 28 28 34 20 37 C12 34 6 28 6 19 V9 Z"/>
        <path class="icon" d="M14 20 L18 24 L26 15"/>
      </g>
      <text class="num" x="550" y="56" text-anchor="end">01</text>
      <text class="title" x="40" y="130">Gestión del SGSI</text>
      <rect class="line grow" x="40" y="146" width="48" height="3" rx="1.5"/>
      <text class="desc" x="40" y="184">Diseño, implementación y mejora continua de</text>
      <text class="desc" x="40" y="210">sistemas de gestión alineados a ISO/IEC 27001.</text>
    </g>
  </g>

  <!-- 02 · Riesgos -->
  <g transform="translate(610,0)">
    <g class="in d2">
      <rect class="card" x="0.5" y="0.5" width="589" height="239" rx="16"/>
      <g transform="translate(40,36) scale(1.15)">
        <path class="icon" d="M20 5 L36 33 H4 Z"/>
        <path class="icon" d="M20 15 V23"/>
        <circle cx="20" cy="28" r="1.6" fill="#FFB224"/>
      </g>
      <text class="num" x="550" y="56" text-anchor="end">02</text>
      <text class="title" x="40" y="130">Gestión de riesgos</text>
      <rect class="line grow" x="40" y="146" width="48" height="3" rx="1.5"/>
      <text class="desc" x="40" y="184">Identificación, análisis y tratamiento de riesgos</text>
      <text class="desc" x="40" y="210">con criterios medibles y trazables.</text>
    </g>
  </g>

  <!-- 03 · Incidentes -->
  <g transform="translate(0,260)">
    <g class="in d3">
      <rect class="card" x="0.5" y="0.5" width="589" height="239" rx="16"/>
      <g transform="translate(40,36) scale(1.15)">
        <path class="icon" d="M3 21 H11 L15 11 L21 31 L25 21 H37"/>
      </g>
      <text class="num" x="550" y="56" text-anchor="end">03</text>
      <text class="title" x="40" y="130">Respuesta a incidentes</text>
      <rect class="line grow" x="40" y="146" width="48" height="3" rx="1.5"/>
      <text class="desc" x="40" y="184">Preparación, contención y lecciones aprendidas</text>
      <text class="desc" x="40" y="210">para responder con orden y rapidez.</text>
    </g>
  </g>

  <!-- 04 · Continuidad -->
  <g transform="translate(610,260)">
    <g class="in d4">
      <rect class="card" x="0.5" y="0.5" width="589" height="239" rx="16"/>
      <g transform="translate(40,36) scale(1.15)">
        <path class="icon" d="M32 13 A13 13 0 1 0 33 25"/>
        <path class="icon" d="M33 5 V13 H25"/>
      </g>
      <text class="num" x="550" y="56" text-anchor="end">04</text>
      <text class="title" x="40" y="130">Continuidad del negocio</text>
      <rect class="line grow" x="40" y="146" width="48" height="3" rx="1.5"/>
      <text class="desc" x="40" y="184">Planes y pruebas para que la operación siga</text>
      <text class="desc" x="40" y="210">en pie ante interrupciones críticas.</text>
    </g>
  </g>
</svg>
