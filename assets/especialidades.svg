<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-label="Especialidades: Seguridad de la información (ISO 27001), Gestión de calidad (ISO 9001), Continuidad del negocio (ISO 22301), Gestión de riesgos, Auditoría de sistemas de gestión, Gobierno de TI y redes">
  <defs>
    <style>
      .card  { fill: #000000; stroke: #ffffff; stroke-opacity: 0.10; }
      .tag   { font: 500 14px "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #FFB224; letter-spacing: 2px; }
      .title { font: 600 27px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -0.3px; }
      .desc  { font: 400 18px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #a1a1aa; }
      .icon  { fill: none; stroke: #FFB224; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
      .line  { fill: #FFB224; }
      .in    { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
      .d1 { animation-delay: .10s; } .d2 { animation-delay: .22s; } .d3 { animation-delay: .34s; }
      .d4 { animation-delay: .46s; } .d5 { animation-delay: .58s; } .d6 { animation-delay: .70s; }
      .grow  { transform-origin: 40px 0; animation: grow 1s cubic-bezier(.2,.7,.2,1) both; }
      .d1 .grow { animation-delay: .50s; } .d2 .grow { animation-delay: .62s; } .d3 .grow { animation-delay: .74s; }
      .d4 .grow { animation-delay: .86s; } .d5 .grow { animation-delay: .98s; } .d6 .grow { animation-delay: 1.10s; }
      @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </defs>

  <!-- 1 · Seguridad de la información -->
  <g transform="translate(0,0)"><g class="in d1">
    <rect class="card" x="0.5" y="0.5" width="589" height="229" rx="16"/>
    <g transform="translate(40,34) scale(1.15)">
      <path class="icon" d="M20 4 L34 9 V19 C34 28 28 34 20 37 C12 34 6 28 6 19 V9 Z"/>
      <path class="icon" d="M14 20 L18 24 L26 15"/>
    </g>
    <text class="tag" x="550" y="56" text-anchor="end">ISO/IEC 27001</text>
    <text class="title" x="40" y="125">Seguridad de la información</text>
    <rect class="line grow" x="40" y="141" width="48" height="3" rx="1.5"/>
    <text class="desc" x="40" y="177">Implementación y mantenimiento de sistemas</text>
    <text class="desc" x="40" y="203">de gestión alineados a ISO/IEC 27001:2022.</text>
  </g></g>

  <!-- 2 · Calidad -->
  <g transform="translate(610,0)"><g class="in d2">
    <rect class="card" x="0.5" y="0.5" width="589" height="229" rx="16"/>
    <g transform="translate(40,34) scale(1.15)">
      <rect class="icon" x="8" y="7" width="24" height="29" rx="3"/>
      <path class="icon" d="M15 7 V4 H25 V7"/>
      <path class="icon" d="M14 22 L18 26 L26 17"/>
    </g>
    <text class="tag" x="550" y="56" text-anchor="end">ISO 9001</text>
    <text class="title" x="40" y="125">Gestión de calidad</text>
    <rect class="line grow" x="40" y="141" width="48" height="3" rx="1.5"/>
    <text class="desc" x="40" y="177">Sistemas de gestión de calidad bajo ISO 9001:2015,</text>
    <text class="desc" x="40" y="203">orientados a procesos y a la mejora continua.</text>
  </g></g>

  <!-- 3 · Continuidad -->
  <g transform="translate(0,250)"><g class="in d3">
    <rect class="card" x="0.5" y="0.5" width="589" height="229" rx="16"/>
    <g transform="translate(40,34) scale(1.15)">
      <path class="icon" d="M32 13 A13 13 0 1 0 33 25"/>
      <path class="icon" d="M33 5 V13 H25"/>
    </g>
    <text class="tag" x="550" y="56" text-anchor="end">ISO 22301</text>
    <text class="title" x="40" y="125">Continuidad del negocio</text>
    <rect class="line grow" x="40" y="141" width="48" height="3" rx="1.5"/>
    <text class="desc" x="40" y="177">Análisis de impacto, planes y pruebas para</text>
    <text class="desc" x="40" y="203">mantener la operación ante interrupciones.</text>
  </g></g>

  <!-- 4 · Riesgos -->
  <g transform="translate(610,250)"><g class="in d4">
    <rect class="card" x="0.5" y="0.5" width="589" height="229" rx="16"/>
    <g transform="translate(40,34) scale(1.15)">
      <path class="icon" d="M20 5 L36 33 H4 Z"/>
      <path class="icon" d="M20 15 V23"/>
      <circle cx="20" cy="28" r="1.6" fill="#FFB224"/>
    </g>
    <text class="tag" x="550" y="56" text-anchor="end">GRC</text>
    <text class="title" x="40" y="125">Gestión de riesgos</text>
    <rect class="line grow" x="40" y="141" width="48" height="3" rx="1.5"/>
    <text class="desc" x="40" y="177">Identificación, análisis y tratamiento de riesgos</text>
    <text class="desc" x="40" y="203">para fortalecer la postura de seguridad.</text>
  </g></g>

  <!-- 5 · Auditoría -->
  <g transform="translate(0,500)"><g class="in d5">
    <rect class="card" x="0.5" y="0.5" width="589" height="229" rx="16"/>
    <g transform="translate(40,34) scale(1.15)">
      <circle class="icon" cx="17" cy="17" r="11"/>
      <path class="icon" d="M25 25 L35 35"/>
      <path class="icon" d="M12 17 L15.5 20.5 L22 14"/>
    </g>
    <text class="tag" x="550" y="56" text-anchor="end">LEAD AUDITOR</text>
    <text class="title" x="40" y="125">Auditoría de sistemas de gestión</text>
    <rect class="line grow" x="40" y="141" width="48" height="3" rx="1.5"/>
    <text class="desc" x="40" y="177">Evaluación del cumplimiento y la madurez de</text>
    <text class="desc" x="40" y="203">los sistemas de gestión como auditor líder.</text>
  </g></g>

  <!-- 6 · Gobierno de TI y redes -->
  <g transform="translate(610,500)"><g class="in d6">
    <rect class="card" x="0.5" y="0.5" width="589" height="229" rx="16"/>
    <g transform="translate(40,34) scale(1.15)">
      <circle class="icon" cx="20" cy="8" r="4"/>
      <circle class="icon" cx="8" cy="32" r="4"/>
      <circle class="icon" cx="32" cy="32" r="4"/>
      <path class="icon" d="M18 11.5 L10 28.5 M22 11.5 L30 28.5 M12 32 H28"/>
    </g>
    <text class="tag" x="550" y="56" text-anchor="end">IT GOVERNANCE</text>
    <text class="title" x="40" y="125">Gobierno de TI y redes</text>
    <rect class="line grow" x="40" y="141" width="48" height="3" rx="1.5"/>
    <text class="desc" x="40" y="177">Gobierno de TI, seguridad de redes, Linux</text>
    <text class="desc" x="40" y="203">y análisis de datos.</text>
  </g></g>
</svg>
